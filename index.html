<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18212b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fahrplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Fahrgemeinschaft Fahrplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mobile-first single column, "today" ticket on top, month grid, bottom sheet for day actions */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#18212b; --muted:#5d6977; --line:#d7dde4;
  --accent:#f2b705; --accent-ink:#2a2100; --sick:#d23c3c; --sick-bg:#fde8e6; --makeup:#11847a; --makeup-bg:#dff4f1;
  --off:#8a94a0; --vac:#1d7fb8; --vac-bg:#e1f0f9; --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222a; --surface-2:#222b34; --ink:#e9eef3; --muted:#9aa6b2; --line:#2f3a45;
  --accent:#f5c22b; --accent-ink:#231b00; --sick:#ff7a6e; --sick-bg:#3a1f1e; --makeup:#4fd1c0; --makeup-bg:#173330;
  --off:#7b8692; --vac:#6cc3f0; --vac-bg:#16303f; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222a; --surface-2:#222b34; --ink:#e9eef3; --muted:#9aa6b2; --line:#2f3a45;
  --accent:#f5c22b; --accent-ink:#231b00; --sick:#ff7a6e; --sick-bg:#3a1f1e; --makeup:#4fd1c0; --makeup-bg:#173330;
  --off:#7b8692; --vac:#6cc3f0; --vac-bg:#16303f; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.mark i{display:block;width:4px;height:18px;background:repeating-linear-gradient(var(--accent) 0 5px,transparent 5px 8px)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off)}
.sync.ok::before{background:var(--makeup)} .sync.warn::before{background:var(--sick)}

/* Today ticket */
.ticket{background:var(--ink);color:var(--bg);border-radius:18px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.ticket .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;opacity:.7;font-weight:700}
.ticket .who{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1.05;letter-spacing:-.02em}
.ticket .who small{display:block;font-size:.95rem;font-family:var(--f-body);font-weight:400;opacity:.8;letter-spacing:0;margin-top:4px}
.ticket .lane{position:absolute;right:18px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--accent) 0 18px,transparent 18px 32px);opacity:.9}
.ticket .next{display:flex;gap:10px;flex-wrap:wrap;padding-right:20px}
.ticket .next span{background:rgba(127,127,127,.22);border-radius:999px;padding:4px 10px;font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:700}
.tag.sick{background:var(--sick-bg);color:var(--sick)} .tag.makeup{background:var(--makeup-bg);color:var(--makeup)}
.tag.swap{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .tag.off{background:var(--surface-2);color:var(--off)}

/* Calendar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{font-size:1.15rem;font-weight:800}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:40px;height:40px;font-size:1.1rem;font-weight:700}
.navgrp{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px}
.day{border:0;background:var(--surface-2);border-radius:10px;aspect-ratio:1/1.15;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 5px;position:relative;font-variant-numeric:tabular-nums;min-width:0}
.day .n{font-size:.8rem;color:var(--muted);font-weight:700}
.day.out{opacity:.35}
.day.weekend{background:transparent}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .n{color:var(--ink)}
.chip{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.78rem;font-family:var(--f-display)}
.chip.lg{width:40px;height:40px;font-size:1rem}
.day .flag{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%}
.flag.sick{background:var(--sick)} .flag.makeup{background:var(--makeup)} .flag.swap{background:var(--muted)}
.day .vacbar{position:absolute;left:6px;right:6px;bottom:2px;height:3px;border-radius:2px;background:var(--vac)}
.day.prestart{background:transparent}
.tag.vac{background:var(--vac-bg);color:var(--vac)}
.btn.vac{color:var(--vac)}
.banner{border-radius:14px;padding:14px;background:var(--sick-bg);display:flex;flex-direction:column;gap:10px}
.banner p{margin:0}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.banner .row .btn{width:auto;flex:1;justify-content:center}
.who-pick{display:flex;flex-wrap:wrap;gap:8px}
.who-pick .btn{width:auto}
.vlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.vlist li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.vlist li .txt{flex:1;min-width:0;font-size:.9rem}
.daterow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{display:flex;flex-direction:column;gap:8px}
.foot .linkbtn{border:0;background:none;padding:0;font-size:.75rem;color:var(--muted);text-decoration:underline;align-self:flex-start}
.log{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:50vh;overflow:auto}
.log li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.log time{font-variant-numeric:tabular-nums;white-space:nowrap}
.log b{color:var(--ink);font-weight:700}
.day.offday .chip{display:none}
.day.offday::after{content:"frei";font-size:.65rem;color:var(--off);margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Debts */
.sectionh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.sectionh h3{font-size:1.05rem;font-weight:800}
.sectionh p{margin:0;font-size:.8rem;color:var(--muted)}
.debts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.debt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--sick-bg)}
.debt .txt{flex:1;min-width:0}
.debt b{font-weight:700}
.debt .cnt{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--sick);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.members{display:flex;flex-wrap:wrap;gap:8px}
.mem{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 3px;font-size:.9rem}
.mem .chip{width:24px;height:24px;font-size:.7rem}
.bal{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Forms / settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-weight:700;font-size:.9rem}
.hint{font-size:.8rem;color:var(--muted);margin:0}
input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wds button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 0;font-weight:700;font-size:.85rem;color:var(--muted)}
.wds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mrow{display:flex;gap:8px;align-items:center}
.mrow input{flex:1}
.mrow .iconbtn{flex:none}
.chipbtn{border:0;background:none;padding:0;border-radius:50%;flex:none;display:grid}
.chipbtn .chip{width:36px;height:36px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.sw{border:0;aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px}
.list{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:10px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;justify-content:center;text-align:center}
.btn.danger{color:var(--sick)}
.btn.makeup{background:var(--makeup-bg);color:var(--makeup);border-color:transparent}
.btn .chip{width:26px;height:26px;font-size:.72rem}
.btn.ghost{background:none;border-style:dashed;color:var(--muted);justify-content:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{font-size:1.25rem;font-weight:800}
.sheet .plan{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px}
.sheet .plan .txt{flex:1;min-width:0}
.sheet .plan .sub{font-size:.85rem;color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><div class="mark"><i></i></div><h1>Fahrplan</h1></div>
    <div class="tabs" id="tabs" hidden>
      <button id="tab-cal" aria-pressed="true">Kalender</button>
      <button id="tab-set" aria-pressed="false">Gruppe</button>
    </div>
  </div>
  <div id="main"><p class="note">Fahrplan wird geladen …</p></div>
  <div class="foot">
    <p class="sync" id="sync">Verbinde …</p>
    <button class="linkbtn" id="logbtn" aria-expanded="false" hidden>Protokoll anzeigen</button>
    <ul class="log" id="log" hidden></ul>
  </div>
</div>
<div id="sheetRoot"></div>

<!-- Gemeinsames Speichern (Firebase). Die Zugangsdaten stehen in firebase-config.js -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
const COLORS=['#2f6fd6','#d9622b','#14876f','#8e4fc9','#c23b6b','#6f7f12','#0f7ea8','#a0522d','#b8860b','#4a5568','#1f3a93','#e0457b'];
let openColor=null;
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MODES={daily:'Täglich',weekly:'Wöchentlich',monthly:'Monatlich'};
const REASON={krank:'krank',tausch:'getauscht',nachholen:'Nachholen',frei:'fällt aus'};
const LS='fahrplan-local-v1';

let data=null, tab='cal', loaded=false;
const now=new Date(); let view={y:now.getFullYear(),m:now.getMonth()};

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayStr=()=>ymd(new Date());
const fmtLong=s=>{const d=parse(s);return WD[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]};
const mod=(a,n)=>((a%n)+n)%n;

// ---------- schedule logic ----------
const member=id=>data.members.find(m=>m.id===id);
const isWork=s=>data.workdays.includes(parse(s).getDay());
const ov=s=>(data.overrides||{})[s];
const counts=s=>isWork(s)&&!(ov(s)&&ov(s).reason==='frei');

// vacations: {id:{member, from, to}} – a person on vacation is skipped, nobody has to make up for it
const vacList=()=>Object.entries(data.vacations||{}).map(([id,v])=>({id,...v}));
const onVac=(id,s)=>vacList().some(v=>v.member===id&&v.from<=s&&s<=v.to);
const vacOn=s=>vacList().filter(v=>v.from<=s&&s<=v.to&&member(v.member));

function slot(s){ // weekly / monthly period number since start
  const d=parse(s), st=parse(data.start);
  if(data.mode==='weekly'){
    const mon=x=>addDays(x,-mod(x.getDay()-1,7));
    return Math.round((mon(d)-mon(st))/(7*864e5));
  }
  return (d.getFullYear()-st.getFullYear())*12+(d.getMonth()-st.getMonth());
}
// daily: walk forward from the start date; each driving day the next person who is not on vacation drives.
// Days that "fall out" don't use up a turn. Cached per render.
let sched=null;
function dailyIdx(s){
  if(!sched) sched={map:{},last:null,ptr:0};
  if(s in sched.map) return sched.map[s];
  const n=data.members.length;
  let x=sched.last?addDays(parse(sched.last),1):parse(data.start);
  while(ymd(x)<=s){
    const d=ymd(x); let idx=null;
    if(counts(d)){
      for(let k=0;k<n;k++){const j=(sched.ptr+k)%n; if(!onVac(data.members[j].id,d)){idx=j;break}}
      if(idx!==null) sched.ptr=idx+1;
    }
    sched.map[d]=idx; sched.last=d; x=addDays(x,1);
  }
  return s in sched.map?sched.map[s]:null;
}
function planned(s){
  if(!data.members.length||!isWork(s)||s<data.start) return null; // nothing before the carpool starts
  const n=data.members.length;
  if(data.mode==='daily'){const i=dailyIdx(s);return i===null?null:data.members[i]}
  const base=mod(slot(s),n);
  for(let k=0;k<n;k++){const m=data.members[(base+k)%n]; if(!onVac(m.id,s)) return m}
  return null;
}
function info(s){
  const p=planned(s), o=ov(s);
  if(!p) return {planned:null,driver:null,status:'none'};
  if(!o) return {planned:p,driver:p,status:'normal'};
  if(o.reason==='frei') return {planned:p,driver:null,status:'frei'};
  return {planned:p,driver:member(o.driver)||null,status:o.reason};
}
// who owes whom: whenever someone drives instead of the planned person, the planned person owes them one trip
function debts(){
  const owe={};
  for(const [s,o] of Object.entries(data.overrides||{})){
    if(!o||o.reason==='frei') continue;
    const p=planned(s); if(!p||!o.driver||o.driver===p.id) continue;
    if(!member(o.driver)) continue;
    const k=p.id+'>'+o.driver; owe[k]=(owe[k]||0)+1;
  }
  const out=[], seen=new Set();
  for(const k of Object.keys(owe)){
    const [a,b]=k.split('>'); const pair=[a,b].sort().join('|'); if(seen.has(pair)) continue; seen.add(pair);
    const net=(owe[a+'>'+b]||0)-(owe[b+'>'+a]||0);
    if(net>0) out.push({debtor:a,creditor:b,n:net}); else if(net<0) out.push({debtor:b,creditor:a,n:-net});
  }
  return out;
}
function nextDriving(from,skipFirst){
  let d=parse(from); if(skipFirst) d=addDays(d,1);
  if(ymd(d)<data.start) d=parse(data.start);
  for(let i=0;i<120;i++,d=addDays(d,1)){const s=ymd(d),inf=info(s); if(inf.driver) return {s,inf};}
  return null;
}

// ---------- storage ----------
// Two ways to keep the plan:
//  * group (Firebase): shared with everyone who has the group link, works offline and syncs when back online
//  * local: only on this device (used when Firebase is not set up or no group was created)
const LS_GROUP='fahrplan-gruppe', LS_CACHE='fahrplan-gruppe-cache';
const FB=window.FAHRPLAN_FIREBASE||null;
let fs=null, docRef=null, synced=null, unsub=null, group=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const clone=o=>JSON.parse(JSON.stringify(o));
const CODE_RE=/^[a-z0-9]{16,40}$/;
const cloudOn=()=>!!fs;

function normalize(d){
  if(!d||!Array.isArray(d.members)) return null;
  d.overrides=d.overrides||{}; d.vacations=d.vacations||{}; d.workdays=d.workdays||[1,2,3,4,5]; d.log=d.log||[]; return d;
}
// ---------- who am I (per device) ----------
const meKey=()=>'fahrplan-ich-'+(group||'lokal');
const meId=()=>{const id=lsGet(meKey());return id&&data&&member(id)?id:null};
const meName=()=>{const id=meId();return id?member(id).name:''};
// ---------- protocol (kept for about 3 months) ----------
const LOG_DAYS=92;
const logCutoff=()=>new Date(Date.now()-LOG_DAYS*864e5).toISOString();
function addLog(x){
  const e={t:new Date().toISOString(),w:meName(),x}, cut=logCutoff();
  const old=(data.log||[]).filter(l=>l.t<cut);
  data.log=[...(data.log||[]).filter(l=>l.t>=cut),e];
  if(group&&docRef){
    const FV=firebase.firestore.FieldValue;
    docRef.update('log',FV.arrayUnion(e)).catch(()=>{});
    if(old.length) docRef.update('log',FV.arrayRemove(...old)).catch(()=>{});
  } else if(!group) lsSet(LS,JSON.stringify(data));
  if(logOpen) renderLog();
}
let logOpen=false;
function renderLog(){
  const ul=document.getElementById('log'), btn=document.getElementById('logbtn');
  btn.hidden=!data; if(!data){ul.hidden=true;return}
  btn.setAttribute('aria-expanded',logOpen); btn.textContent=logOpen?'Protokoll ausblenden':'Protokoll anzeigen';
  ul.hidden=!logOpen; if(!logOpen) return;
  const cut=logCutoff(), items=(data.log||[]).filter(l=>l.t>=cut).sort((a,b)=>a.t<b.t?1:-1);
  const fmt=t=>{const d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'. '+pad(d.getHours())+':'+pad(d.getMinutes())};
  ul.innerHTML=items.length?items.map(l=>`<li><time datetime="${esc(l.t)}">${fmt(l.t)}</time><span>${l.w?`<b>${esc(l.w)}</b>: `:''}${esc(l.x)}</span></li>`).join('')
    :'<li><span>Noch keine Einträge. Hier steht, wer wann was geändert hat (letzte 3 Monate).</span></li>';
}
// ---------- delete everything, only when all members agree ----------
const allAgreed=r=>!!r&&data.members.every(m=>r.ok&&r.ok[m.id]);
function clearAll(){
  data.overrides={}; data.vacations={};
  if(group&&docRef){ delete data.deleteRequest; docRef.update('deleteRequest',firebase.firestore.FieldValue.delete()).catch(()=>{}); }
  addLog('Alle Einträge gelöscht'+(group&&data.members.length>1?' (alle haben zugestimmt)':''));
  save();
}
function requestDelete(){
  const me=meId(); if(!me||!docRef) return;
  data.deleteRequest={by:me,at:new Date().toISOString(),ok:{[me]:true}};
  docRef.update('deleteRequest',data.deleteRequest).catch(()=>{});
  addLog('möchte alle Einträge löschen (alle müssen zustimmen)');
  render();
}
function approveDelete(){
  const me=meId(), r=data.deleteRequest; if(!me||!r||!docRef) return;
  r.ok=r.ok||{}; r.ok[me]=true;
  docRef.update(new firebase.firestore.FieldPath('deleteRequest','ok',me),true).catch(()=>{});
  addLog('stimmt dem Löschen aller Einträge zu');
  if(allAgreed(r)) clearAll(); else render();
}
function rejectDelete(){
  if(!data.deleteRequest||!docRef) return;
  const mine=data.deleteRequest.by===meId();
  delete data.deleteRequest;
  docRef.update('deleteRequest',firebase.firestore.FieldValue.delete()).catch(()=>{});
  addLog(mine?'hat den Löschantrag zurückgezogen':'hat das Löschen aller Einträge abgelehnt');
  render();
}
function deleteBanner(){
  const r=data.deleteRequest; if(!r||!group) return '';
  const by=member(r.by), me=meId();
  const yes=data.members.filter(m=>r.ok&&r.ok[m.id]).map(m=>m.name), no=data.members.filter(m=>!(r.ok&&r.ok[m.id])).map(m=>m.name);
  return `<div class="banner" role="status"><p><b>${esc(by?by.name:'Jemand')}</b> möchte alle Einträge löschen (krank, Tausch, Ausfall, Urlaub). Gelöscht wird erst, wenn alle zugestimmt haben.</p>
    <p class="hint">Zugestimmt: ${esc(yes.join(', ')||'–')} · Es fehlt: ${esc(no.join(', ')||'–')}</p>
    ${!me?'<p class="hint">Wähle oben aus, wer du bist, um abzustimmen.</p>'
      :r.ok&&r.ok[me]?`<div class="row"><button class="btn" data-del-no>${r.by===me?'Antrag zurückziehen':'Doch nicht löschen'}</button></div>`
      :'<div class="row"><button class="btn danger" data-del-yes>Zustimmen</button><button class="btn" data-del-no>Ablehnen</button></div>'}</div>`;
}
function bindBanner(){
  document.querySelectorAll('[data-del-yes]').forEach(b=>b.onclick=approveDelete);
  document.querySelectorAll('[data-del-no]').forEach(b=>b.onclick=rejectDelete);

function setSync(cls,txt){const el=document.getElementById('sync');el.className='sync '+cls;el.textContent=txt}

function save(){
  if(group){
    if(!docRef){ // group known, but not connected yet (first start without internet)
      setSync('warn','Noch keine Verbindung zur Gruppe. Die Änderung wurde nicht gespeichert.');
      const c=lsGet(LS_CACHE); data=c?normalize(JSON.parse(c)):data; render(); return;
    }
    render(); pushCloud(); return;
  }
  render(); lsSet(LS,JSON.stringify(data));
}
// send only what changed, so two people editing different days never overwrite each other
function pushCloud(){
  const cur=clone(data), prev=synced; synced=cur; lsSet(LS_CACHE,JSON.stringify(cur));
  const fail=e=>setSync('warn','Speichern fehlgeschlagen ('+(e&&e.code||'Fehler')+'). Bitte später erneut versuchen.');
  if(!prev){ docRef.set(cur).catch(fail); return; }
  const FP=firebase.firestore.FieldPath, DEL=firebase.firestore.FieldValue.delete(), args=[];
  for(const k of ['members','mode','start','workdays']) if(JSON.stringify(prev[k])!==JSON.stringify(cur[k])) args.push(new FP(k),cur[k]);
  for(const map of ['overrides','vacations']){
    const po=prev[map]||{}, co=cur[map]||{};
    for(const d of new Set([...Object.keys(po),...Object.keys(co)]))
      if(JSON.stringify(po[d])!==JSON.stringify(co[d])) args.push(new FP(map,d), co[d]===undefined?DEL:co[d]);
  }
  if(args.length) docRef.update(...args).catch(fail);
}
function loadLocal(){
  try{const r=lsGet(LS); data=r?normalize(JSON.parse(r)):null}catch(e){data=null}
  loaded=true; setSync('', cloudOn()?'Nur auf diesem Gerät gespeichert · unter „Gruppe“ teilen':'Nur auf diesem Gerät gespeichert'); render();
}
function authReady(){
  return new Promise(res=>{const off=firebase.auth().onAuthStateChanged(u=>{
    if(u){off();res(u)} else firebase.auth().signInAnonymously().catch(()=>setSync('warn','Anmeldung bei der Gruppe nicht möglich. Bist du online?'));
  })});
}
function newCode(){
  const abc='abcdefghjkmnpqrstuvwxyz23456789', r=new Uint8Array(20); crypto.getRandomValues(r);
  return Array.from(r,x=>abc[x%abc.length]).join('');
}
const inviteLink=()=>location.origin+location.pathname+'?g='+group;
function readCode(txt){const m=String(txt).match(/[?&]g=([a-z0-9]+)/i);const c=(m?m[1]:String(txt)).trim().toLowerCase();return CODE_RE.test(c)?c:null}

async function connectGroup(code){
  group=code; lsSet(LS_GROUP,code);
  const c=lsGet(LS_CACHE); if(c){data=normalize(JSON.parse(c)); synced=data?clone(data):null; loaded=true; render();}
  setSync('','Verbinde mit der Gruppe …');
  await authReady();
  if(group!==code) return;
  docRef=fs.collection('gruppen').doc(code);
  if(unsub) unsub();
  unsub=docRef.onSnapshot({includeMetadataChanges:true},snap=>{
    loaded=true;
    if(!snap.exists){
      if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites){leaveGroup('Diese Gruppe gibt es nicht (mehr). Prüfe den Einladungslink.')}
      else if(!data) render();
      return;
    }
    const d=normalize(clone(snap.data()));
    synced=clone(d); lsSet(LS_CACHE,JSON.stringify(d));
    if(JSON.stringify(d)!==JSON.stringify(data)){data=d; render();}
    // everyone agreed to delete: the person who asked carries it out (also if they were offline meanwhile)
    if(!snap.metadata.fromCache&&allAgreed(d.deleteRequest)&&d.deleteRequest.by===meId()) clearAll();
    if(snap.metadata.hasPendingWrites) setSync('','Offline gespeichert · wird abgeglichen, sobald du online bist');
    else if(snap.metadata.fromCache) setSync('','Offline · zeigt den letzten Stand');
    else setSync('ok','Synchronisiert · alle in der Gruppe sehen diesen Plan');
  },err=>setSync('warn','Kein Zugriff auf die Gruppe ('+err.code+').'));
}
async function createGroup(d){
  setSync('','Gruppe wird angelegt …');
  await authReady();
  const code=newCode();
  docRef=fs.collection('gruppen').doc(code);
  data=normalize(clone(d)); synced=null;
  const meLocal=lsGet(meKey());
  addLog('Plan für die Gruppe freigegeben'); // goes into the first upload below
  group=code; lsSet(LS_GROUP,code); if(meLocal) lsSet(meKey(),meLocal);
  pushCloud();
  connectGroup(code);
}
function leaveGroup(msg){
  if(unsub) unsub(); unsub=null; docRef=null; synced=null; group=null;
  lsSet(LS_GROUP,null); lsSet(LS_CACHE,null);
  loadLocal(); if(msg) setSync('warn',msg);
}
async function init(){
  // invitation link: ...?g=CODE
  const url=new URL(location.href), inv=url.searchParams.get('g');
  if(inv!==null){ const c=readCode(inv); if(c){lsSet(LS_GROUP,c); lsSet(LS_CACHE,null);} url.searchParams.delete('g'); history.replaceState(null,'',url.pathname+url.search+url.hash); }
  if(FB&&window.firebase){
    try{
      firebase.initializeApp(FB); fs=firebase.firestore();
      try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    }catch(e){fs=null}
  }
  const g=lsGet(LS_GROUP);
  if(g&&fs){connectGroup(g);return;}
  if(g){ // group saved, but Firebase could not load (offline on very first start)
    group=g; const c=lsGet(LS_CACHE); data=c?normalize(JSON.parse(c)):null; loaded=true;
    setSync('warn','Keine Verbindung · Plan wird nur angezeigt'); render(); return;
  }
  loadLocal();
}

// ---------- rendering helpers ----------
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>{const p=n.trim().split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:(p[0][1]||''))).toUpperCase()};
const chip=(m,cls='')=>m?`<span class="chip ${cls}" style="background:${m.color}">${esc(initials(m.name))}</span>`:'';
const tagFor=st=>st==='krank'?'<span class="tag sick">Ersatz wegen Krankheit</span>':st==='nachholen'?'<span class="tag makeup">Nachholfahrt</span>':st==='tausch'?'<span class="tag swap">Getauscht</span>':st==='frei'?'<span class="tag off">Fällt aus</span>':'';

function ticketHTML(){

    if(inf.status==='krank') sub=esc(inf.planned.name)+' ist krank, '+esc(inf.driver.name)+' springt ein';
    else if(inf.status==='nachholen') sub=esc(inf.driver.name)+' holt eine Fahrt für '+esc(inf.planned.name)+' nach';

  } else {

function calView(){
  const first=new Date(view.y,view.m,1,12), lead=mod(first.getDay()-1,7);
  let cells='';['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(w=>cells+=`<div class="wd">${w}</div>`);
  const t=todayStr();
  for(let i=0;i<42;i++){
    const d=addDays(first,i-lead), s=ymd(d), inf=info(s);
    if(i>=35&&d.getMonth()!==view.m) break;
    const cls=['day']; if(d.getMonth()!==view.m) cls.push('out'); if(!isWork(s)) cls.push('weekend'); if(s===t) cls.push('today'); if(inf.status==='frei') cls.push('offday'); if(s<data.start) cls.push('prestart');
    const vac=vacOn(s);
    const flag=inf.status==='krank'?'<span class="flag sick"></span>':inf.status==='nachholen'?'<span class="flag makeup"></span>':inf.status==='tausch'?'<span class="flag swap"></span>':'';
    const lab=fmtLong(s)+(inf.driver?': '+inf.driver.name+' fährt':inf.status==='frei'?': fällt aus':': keine Fahrt')+(vac.length?', Urlaub: '+vac.map(v=>member(v.member).name).join(', '):'');
    cells+=`<button class="${cls.join(' ')}" data-d="${s}" aria-label="${esc(lab)}"><span class="n">${d.getDate()}</span>${chip(inf.driver)}${flag}${vac.length?'<span class="vacbar"></span>':''}</button>`;
  }
  const ds=debts();
  const debtHTML=ds.length?`<ul class="debts">${ds.map(x=>{const a=member(x.debtor),b=member(x.creditor);return `<li class="debt">${chip(a)}<div class="txt"><b>${esc(a.name)}</b> muss für <b>${esc(b.name)}</b> nachholen</div><span class="cnt">${x.n}×</span></li>`}).join('')}</ul>`
    :'<p class="empty">Alles ausgeglichen. Wenn jemand krank ist und ein anderer einspringt, erscheint hier, wer die Fahrt nachholen muss.</p>';
  return `<div class="stack">${whoCard(false)}${deleteBanner()}${ticketHTML()}
  <section class="card">
    <div class="calhead"><h2>${MONTHS[view.m]} ${view.y}</h2>
      <div class="navgrp"><button class="iconbtn" id="prev" aria-label="Vorheriger Monat">‹</button><button class="iconbtn" id="now" style="padding:0 10px;font-size:.85rem">Heute</button><button class="iconbtn" id="next" aria-label="Nächster Monat">›</button></div></div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--sick)"></i>Ersatz (krank)</span><span><i style="background:var(--makeup)"></i>Nachgeholt</span><span><i style="background:var(--muted)"></i>Getauscht</span><span><i style="background:var(--vac);border-radius:2px;width:14px;height:4px"></i>Urlaub</span></div>
    <p class="hint" style="margin-top:8px">Tippe auf einen Tag, um Krankheit, Tausch oder Ausfall einzutragen.</p>
  </section>
  <section class="card"><div class="sectionh"><h3>Nachholen</h3><p>offene Fahrten</p></div>${debtHTML}</section>
  <section class="card"><div class="sectionh"><h3>Reihenfolge</h3><p>${MODES[data.mode]} ab ${fmtLong(data.start)}</p></div>
    <div class="members">${data.members.map((m,i)=>`<span class="mem">${chip(m)}${i+1}. ${esc(m.name)}</span>`).join('')}</div></section>
  </div>`;
}

let sheetMode=null, vacDraft={member:'',from:'',to:''};
function openDay(s,mode){sheetMode=mode||null;const root=document.getElementById('sheetRoot');

    body=`<div class="plan">${chip(inf.driver||p,'lg')}<div class="txt">

        ${vacBtn}
        ${o?`<button class="btn ghost" id="reset">Zurück auf Plan: ${esc(p.name)} fährt</button>`:''}

  }

  const q=id=>document.getElementById(id);

      :v.reason==='krank'?`${ds}: ${p.name} krank, ${d.name} springt ein`:v.reason==='nachholen'?`${ds}: ${d.name} holt für ${p.name} nach`
      :`${ds}: ${d.name} fährt statt ${p.name}`);
    if(v)data.overrides[s]=v;else delete data.overrides[s];closeSheet();save()};
  if(q('addvac')) q('addvac').onclick=()=>{vacDraft={member:meId()||'',from:s,to:s};openDay(s,'urlaub')};
  root.querySelectorAll('[data-vacwho]').forEach(b=>b.onclick=()=>{vacDraft.member=b.dataset.vacwho;vacDraft.from=q('vfrom').value;vacDraft.to=q('vto').value;openDay(s,'urlaub')});
  if(q('savevac')) q('savevac').onclick=()=>{
    const f=q('vfrom').value,t=q('vto').value,err=q('vacerr');
    if(!vacDraft.member){err.hidden=false;err.textContent='Bitte auswählen, wer Urlaub hat.';return}
    if(!f||!t||t<f){err.hidden=false;err.textContent='Das Enddatum muss am oder nach dem Startdatum liegen.';return}
    const id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    data.vacations[id]={member:vacDraft.member,from:f,to:t};
    addLog(`Urlaub: ${member(vacDraft.member).name}, ${fmtShort(f)} bis ${fmtShort(t)}`);
    closeSheet();save()};
  root.querySelectorAll('[data-unvac]').forEach(b=>b.onclick=()=>{const v=data.vacations[b.dataset.unvac];if(!v)return;
    addLog(`Urlaub gelöscht: ${member(v.member)?member(v.member).name:'?'}, ${fmtShort(v.from)} bis ${fmtShort(v.to)}`);
    delete data.vacations[b.dataset.unvac];closeSheet();save()});
  if(q('sick')) q('sick').onclick=()=>openDay(s,'krank');
  if(q('swap')) q('swap').onclick=()=>openDay(s,'tausch');
  if(q('sickweek')) q('sickweek').onclick=()=>{const p=inf.planned,others=data.members.filter(m=>m.id!==p.id);
    if(others.length===1) applySickWeek(s,p.id,others[0].id); else openDay(s,'krankwoche')};
  root.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>applySickWeek(s,inf.planned.id,b.dataset.week));
  if(q('back')) q('back').onclick=()=>openDay(s,'__keep');
  if(q('off')) q('off').onclick=()=>setO({reason:'frei'});
  if(q('reset')) q('reset').onclick=()=>setO(null);
  root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>setO({reason:sheetMode,driver:b.dataset.pick}));
  root.querySelectorAll('[data-makeup]').forEach(b=>b.onclick=()=>setO({reason:'nachholen',driver:b.dataset.makeup}));
  const f=root.querySelector('.sheet button:not(#close)'); if(f) f.focus();
}
// all days in the Mon–Sun week of s on which this person is planned to drive (cancelled days excluded)
function weekDaysOf(s,id){
  const d=parse(s), mon=addDays(d,-mod(d.getDay()-1,7)), out=[];
  for(let i=0;i<7;i++){const x=ymd(addDays(mon,i)),p=planned(x),o=ov(x); if(p&&p.id===id&&!(o&&o.reason==='frei')) out.push(x)}
  return out;
}
const fmtShort=s=>{const d=parse(s);return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
function applySickWeek(s,sickId,pick){
  const others=data.members.filter(m=>m.id!==sickId), days=weekDaysOf(s,sickId);
  if(days.length) addLog(`${member(sickId).name} ist die Woche krank (${days.map(fmtShort).join(', ')})`);
  days.forEach((x,i)=>{
    const driver=pick==='auto'?others[i%others.length].id:pick;
    data.overrides[x]={reason:'krank',driver};
  });
  closeSheet(); save();
}
function closeSheet(){document.getElementById('sheetRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

// ---------- settings ----------
function modeSeg(cur){return `<div class="seg" role="group" aria-label="Wechsel">${Object.entries(MODES).map(([k,v])=>`<button data-mode="${k}" aria-pressed="${cur===k}">${v}</button>`).join('')}</div>`}
function wdSeg(cur){return `<div class="wds">${[1,2,3,4,5,6,0].map(d=>`<button data-wd="${d}" aria-pressed="${cur.includes(d)}">${WD[d]}</button>`).join('')}</div>`}
function settingsView(){
  const today=todayStr(), upcoming=vacList().filter(v=>v.to>=today&&member(v.member)).sort((a,b)=>a.from<b.from?-1:1);
  return `<div class="stack">${whoCard(whoForce)}${deleteBanner()}<section class="card stack">
    <div class="field"><span class="flabel">Mitfahrer in Reihenfolge</span>
      <div class="list">${data.members.map((m,i)=>`<div class="mrow"><button class="chipbtn" data-color="${m.id}" aria-expanded="${openColor===m.id}" aria-label="Farbe von ${esc(m.name)} ändern">${chip(m)}</button><input type="text" id="mem-${m.id}" value="${esc(m.name)}" aria-label="Name ${i+1}">
        <button class="iconbtn" data-up="${i}" aria-label="Nach oben" ${i?'':'disabled'}>↑</button>
        <button class="iconbtn" data-del="${m.id}" aria-label="${esc(m.name)} entfernen">✕</button></div>
        ${openColor===m.id?`<div class="palette" role="group" aria-label="Farbe für ${esc(m.name)}">${COLORS.map(c=>`<button class="sw" data-sw="${c}" style="background:${c}" aria-label="Farbe ${c}" aria-pressed="${m.color===c}"></button>`).join('')}</div>`:''}`).join('')}
      <div class="mrow"><input type="text" id="newmem" placeholder="Name hinzufügen"><button class="iconbtn" id="addmem" aria-label="Hinzufügen">+</button></div></div>
      <p class="hint">Die erste Person fährt am Startdatum, danach wird reihum gewechselt. Tippe auf den farbigen Kreis, um die Farbe zu ändern.</p></div>
    <div class="field"><span class="flabel">Wie wird gewechselt?</span>${modeSeg(data.mode)}
      <p class="hint">${data.mode==='daily'?'Jeden Fahrtag fährt die nächste Person.':data.mode==='weekly'?'Eine Person fährt die ganze Woche (Mo–So), dann die nächste.':'Eine Person fährt den ganzen Kalendermonat.'}</p></div>
    <div class="field"><label for="start">Startdatum</label><input type="date" id="start" value="${data.start}"></div>
    <div class="field"><span class="flabel">Fahrtage</span>${wdSeg(data.workdays)}</div>
  </section>
  <section class="card stack"><div class="sectionh"><h3>Urlaub</h3><p>Wer im Urlaub ist, wird übersprungen</p></div>
    ${upcoming.length?`<ul class="vlist">${upcoming.map(v=>{const m=member(v.member);return `<li>${chip(m)}<span class="txt"><b>${esc(m.name)}</b>, ${fmtShort(v.from)} bis ${fmtShort(v.to)}</span><button class="iconbtn" data-unvac2="${v.id}" aria-label="Urlaub von ${esc(m.name)} löschen">✕</button></li>`}).join('')}</ul>`
      :'<p class="hint" style="margin:0">Kein Urlaub eingetragen. Tippe im Kalender auf einen Tag und dann auf „Urlaub eintragen“.</p>'}
  </section>
  ${shareCard()}
  <section class="card stack"><div class="sectionh"><h3>Einträge</h3></div>
    ${group&&data.members.length>1
      ?(data.deleteRequest?'<p class="hint" style="margin:0">Ein Löschantrag läuft bereits (siehe oben).</p>'
        :`<button class="btn danger" id="reqdel" ${meId()?'':'disabled'}>Alle Einträge löschen …</button>
          <p class="hint" style="margin:0">${meId()?'Gelöscht wird erst, wenn alle aus der Gruppe zugestimmt haben.':'Wähle zuerst oben aus, wer du bist.'}</p>`)
      :'<button class="btn danger" id="clearov">Alle Einträge (krank, Tausch, Ausfall, Urlaub) löschen</button>'}
  </section></div>`;
}
function shareCard(){
  if(!FB) return `<section class="card stack"><div class="sectionh"><h3>Gemeinsam nutzen</h3></div>
    <p class="hint" style="margin:0">Der Plan liegt nur auf diesem Gerät. Gemeinsames Speichern ist noch nicht eingerichtet.</p></section>`;
  if(group) return `<section class="card stack"><div class="sectionh"><h3>Gemeinsam nutzen</h3><p>Gruppe aktiv</p></div>
    <p class="hint" style="margin:0">Alle, die diesen Link öffnen, sehen denselben Plan und können eintragen. Das klappt auch ohne Internet: Einträge werden abgeglichen, sobald das Handy wieder online ist.</p>
    <div class="field"><label for="invite">Einladungslink</label><input type="text" id="invite" readonly value="${esc(inviteLink())}"></div>
    <div class="list">
      ${navigator.share?'<button class="btn primary" id="shareinv">Link teilen (WhatsApp, SMS …)</button>':''}
      <button class="btn" id="copyinv">Link kopieren</button>
    </div>
    <p class="hint" id="invhint" hidden></p>
    <p class="hint" style="margin:0">Auf diesem Handy bist du: <b>${esc(meName()||'noch nicht ausgewählt')}</b> · <button class="linkbtn" id="changeme" style="border:0;background:none;padding:0;color:inherit;text-decoration:underline;font:inherit">ändern</button></p>
    <button class="btn ghost" id="leave">Gruppe auf diesem Gerät verlassen</button></section>`;
  return `<section class="card stack"><div class="sectionh"><h3>Gemeinsam nutzen</h3></div>
    <p class="hint" style="margin:0">Im Moment liegt der Plan nur auf diesem Gerät. Teile ihn, damit alle Mitfahrer dieselben Einträge sehen.</p>
    <button class="btn primary" id="makegroup">Plan mit anderen teilen</button>
    ${joinForm()}</section>`;
}
function joinForm(){
  return `<div class="field"><label for="joincode">Schon eingeladen? Link oder Code einfügen</label>
    <div class="mrow"><input type="text" id="joincode" placeholder="https://…?g=… oder Code" autocomplete="off"><button class="iconbtn" id="joinbtn" aria-label="Beitreten" style="padding:0 12px">Beitreten</button></div>
    <p class="hint" id="joinerr" hidden></p></div>`;
}
function bindJoin(){
  const b=document.getElementById('joinbtn'); if(!b) return;
  const go=()=>{const c=readCode(document.getElementById('joincode').value);const e=document.getElementById('joinerr');
    if(!c){e.hidden=false;e.textContent='Das ist kein gültiger Einladungslink oder Code.';return}
    lsSet(LS_CACHE,null); data=null; loaded=false; tab='cal'; render(); connectGroup(c)};
  b.onclick=go; document.getElementById('joincode').onkeydown=e=>{if(e.key==='Enter')go()};
}
let armLeave=false;
function bindShare(){
  bindJoin();
  const q=id=>document.getElementById(id);
  if(q('makegroup')) q('makegroup').onclick=()=>createGroup(data);
  const hint=t=>{const h=q('invhint');h.hidden=false;h.textContent=t};
  if(q('shareinv')) q('shareinv').onclick=()=>navigator.share({title:'Fahrplan',text:'Unser Fahrplan für die Fahrgemeinschaft:',url:inviteLink()}).catch(()=>{});
  if(q('copyinv')) q('copyinv').onclick=()=>{
    const inp=q('invite');
    (navigator.clipboard?navigator.clipboard.writeText(inviteLink()):Promise.reject()).then(()=>hint('Link kopiert.'))
      .catch(()=>{inp.focus();inp.select();hint('Link markiert. Jetzt kopieren.')});
  };
  if(q('leave')) q('leave').onclick=()=>{const b=q('leave');
    if(!armLeave){armLeave=true;b.textContent='Wirklich verlassen? Nochmal tippen';return}
    armLeave=false; leaveGroup(); tab='cal'; render();};
}
let armClear=false;
function bindSettings(){
  document.querySelectorAll('[id^="mem-"]').forEach(inp=>inp.onchange=()=>{const m=member(inp.id.slice(4));const v=inp.value.trim();if(m&&v&&v!==m.name){addLog(`Name geändert: ${m.name} → ${v}`);m.name=v;save()}});
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{openColor=openColor===b.dataset.color?null:b.dataset.color;render()});
  document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const m=member(openColor);if(m){m.color=b.dataset.sw;openColor=null;addLog(`Farbe von ${m.name} geändert`);save()}});
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;const a=data.members;[a[i-1],a[i]]=[a[i],a[i-1]];addLog(`Reihenfolge geändert: ${a.map(m=>m.name).join(', ')}`);save()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(data.members.length<=1)return;const m=member(b.dataset.del);addLog(`${m.name} aus der Fahrgemeinschaft entfernt`);data.members=data.members.filter(x=>x.id!==b.dataset.del);save()});
  const add=()=>{const v=document.getElementById('newmem').value.trim();if(!v)return;data.members.push(newMember(v,data.members.length));addLog(`${v} hinzugefügt`);save()};
  document.getElementById('addmem').onclick=add;
  document.getElementById('newmem').onkeydown=e=>{if(e.key==='Enter')add()};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(data.mode===b.dataset.mode)return;data.mode=b.dataset.mode;addLog(`Wechsel geändert: ${MODES[data.mode]}`);save()});
  document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{const d=+b.dataset.wd;data.workdays=data.workdays.includes(d)?data.workdays.filter(x=>x!==d):[...data.workdays,d];
    addLog(`Fahrtage geändert: ${[1,2,3,4,5,6,0].filter(x=>data.workdays.includes(x)).map(x=>WD[x]).join(', ')||'keine'}`);save()});
  document.getElementById('start').onchange=e=>{if(e.target.value&&e.target.value!==data.start){data.start=e.target.value;addLog(`Startdatum geändert: ${fmtShort(data.start)}`);save()}};
  const c=document.getElementById('clearov');
  if(c) c.onclick=()=>{if(!armClear){armClear=true;c.textContent='Wirklich löschen? Nochmal tippen';return}armClear=false;clearAll()};
  const rq=document.getElementById('reqdel');
  if(rq) rq.onclick=()=>{if(!armClear){armClear=true;rq.textContent='Löschen beantragen? Nochmal tippen';return}armClear=false;requestDelete()};
  document.querySelectorAll('[data-unvac2]').forEach(b=>b.onclick=()=>{const v=data.vacations[b.dataset.unvac2];if(!v)return;
    addLog(`Urlaub gelöscht: ${member(v.member).name}, ${fmtShort(v.from)} bis ${fmtShort(v.to)}`);delete data.vacations[b.dataset.unvac2];save()});
  bindShare();
}
function newMember(name,i){return {id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,color:COLORS[i%COLORS.length]}}

// ---------- setup ----------
let draft={names:['',''],mode:'daily',start:todayStr()};
function setupView(){
  return `<section class="card stack">
    <div><h2 style="font-size:1.4rem;font-weight:800">Fahrgemeinschaft anlegen</h2>
    <p class="hint" style="margin-top:4px">Trage ein, wer mitfährt und wie ihr euch abwechselt. Danach siehst du im Kalender, wer wann fährt.</p></div>
    <div class="field"><span class="flabel">Wer fährt mit? (in Reihenfolge)</span><div class="list">
      ${draft.names.map((n,i)=>`<div class="mrow"><input type="text" id="d-${i}" value="${esc(n)}" placeholder="Name ${i+1}" aria-label="Name ${i+1}">${draft.names.length>2?`<button class="iconbtn" data-rm="${i}" aria-label="Entfernen">✕</button>`:''}</div>`).join('')}
      <button class="btn ghost" id="dadd">+ Weitere Person</button></div></div>
    <div class="field"><span class="flabel">Wie wird gewechselt?</span>${modeSeg(draft.mode)}</div>
    <div class="field"><label for="dstart">Startdatum</label><input type="date" id="dstart" value="${draft.start}"><p class="hint">An diesem Tag fährt die erste Person der Liste.</p></div>
    <button class="btn primary" id="create">Fahrplan erstellen</button>
    <p class="hint" id="derr" hidden></p>
    ${FB?'<p class="hint" style="margin:0">Der Plan wird automatisch als Gruppe angelegt. Unter „Gruppe“ findest du danach den Link für deine Mitfahrer.</p>':''}
  </section>
  ${FB?`<section class="card stack">${joinForm()}</section>`:''}`;
}
function bindSetup(){
  const sync=()=>{draft.names=draft.names.map((_,i)=>document.getElementById('d-'+i).value);draft.start=document.getElementById('dstart').value||draft.start};
  document.getElementById('dadd').onclick=()=>{sync();draft.names.push('');render();document.getElementById('d-'+(draft.names.length-1)).focus()};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();draft.names.splice(+b.dataset.rm,1);render()});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{sync();draft.mode=b.dataset.mode;render()});
  document.getElementById('create').onclick=()=>{sync();const names=draft.names.map(s=>s.trim()).filter(Boolean);
    if(names.length<2){const e=document.getElementById('derr');e.hidden=false;e.textContent='Bitte mindestens zwei Namen eintragen.';return}
    data={members:names.map(newMember),mode:draft.mode,start:draft.start,workdays:[1,2,3,4,5],overrides:{},vacations:{},log:[]};
    addLog(`Fahrplan angelegt: ${names.join(', ')}, ${MODES[draft.mode]} ab ${fmtShort(draft.start)}`);
    data.members.forEach((m,i)=>m.color=COLORS[i%COLORS.length]);
    tab='cal';
    if(cloudOn()) createGroup(data); else save()};
  bindJoin();
}

document.getElementById('tab-cal').onclick=()=>{tab='cal';render()};
document.getElementById('tab-set').onclick=()=>{tab='set';render()};
document.getElementById('logbtn').onclick=()=>{logOpen=!logOpen;renderLog()};
init();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
